[/Script/UnrealEd.EditorLoadingSavingSettings]
; Raw FMOD source audio lives in the private ExternalAssets repo (Content/ExternalAssets/FMODAudio)
; and is used by the FMOD Studio project, not by Unreal. Stop the editor auto-importing it as SoundWaves.
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*"),(Wildcard="ExternalAssets/FMODAudio/*")))
